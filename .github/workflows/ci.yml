name: Vérifier et régénérer le site

# CI automatique en lecture seule : l’artefact vérifié n’est pas un déploiement.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lire les sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Préparer Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Installer les dépendances verrouillées
        run: npm ci --ignore-scripts
      - name: Régénérer les Markdown et vérifier le site et la maintenance
        run: npm test
      - name: Tester le serveur d’aperçu en isolation
        run: python3 tests/lan.test.py
      - name: Conserver le site régénéré, sans le publier
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: site-verifie
          path: site
          retention-days: 1
          include-hidden-files: true
