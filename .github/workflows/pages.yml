name: Publier le site ou la maintenance
run-name: Publier « ${{ inputs.mode }} » depuis ${{ github.ref_name }}

# Un push, y compris de Markdown, ne publie jamais automatiquement.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'site = site complet ; maintenance = page d’attente'
        type: choice
        required: true
        default: site
        options:
          - site
          - maintenance

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lire les sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Préparer Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Refuser tout mode inconnu
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in site|maintenance) ;; *) echo 'Mode inconnu' >&2; exit 1 ;; esac
      - name: Installer les dépendances verrouillées du site
        if: inputs.mode == 'site'
        run: npm ci --ignore-scripts
      - name: Générer et tester le site complet
        if: inputs.mode == 'site'
        run: npm test
      - name: Bloquer les exemples fictifs avant publication
        if: inputs.mode == 'site'
        run: npm run check:publication
      - name: Vérifier la maintenance indépendamment du contenu et de npm
        if: inputs.mode == 'maintenance'
        run: node --test tests/maintenance.test.mjs
      - name: Générer uniquement la maintenance
        if: inputs.mode == 'maintenance'
        run: node scripts/build-maintenance.mjs
      - name: Préparer uniquement les fichiers compilés
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true # .nojekyll seulement dans cette sortie contrôlée.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurer Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Publier sur Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
